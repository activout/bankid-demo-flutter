name: Update Flutter Version in FVM

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Monthly on the 1st day

env:
  CI: true

jobs:
  update-flutter-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install FVM
        run: dart pub global activate fvm

      - name: Run fvm doctor
        run: fvm doctor

      - name: Run FVM use stable --pin
        run: fvm use stable --pin

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          # PAT/App token so CI runs on the PR; GITHUB_TOKEN-created PRs don't trigger workflows
          token: ${{ secrets.FVM_UPDATE_TOKEN || github.token }}
          commit-message: "Update Flutter version to latest stable"
          title: "Update Flutter version to latest stable"
          body: "This PR updates the Flutter version to the latest stable release."
          branch: "update-flutter-stable"
          delete-branch: true
